<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta | FuturoYO</title>

    <link rel="stylesheet" href="style.css">

    <script src="registro.js" defer></script>

</head>

<body>

    <header>

        <h1>FuturoYO</h1>

        <p>Controla tus gastos y mejora tus hábitos financieros</p>

    </header>

    <main>

        <div class="registro">

            <h2>Crear Cuenta</h2>

            <form id="formRegistro">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre"
                    required>

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingrese su correo"
                    required>

                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingrese su contraseña"
                    required>

                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Repita su contraseña"
                    required>

                <button type="submit">

                    Crear Cuenta

                </button>

            </form>

            <p id="mensaje"></p>

            <hr>

            <p>
                ¿Ya tienes una cuenta?
            </p>

            <a href="login.html">

                Iniciar sesión

            </a>

            <br><br>


        </div>

    </main>

</body>

</html>
