<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | FuturoYO</title>

    <link rel="stylesheet" href="style.css">

    <script src="login.js" defer></script>

</head>

<body>

    <header>

        <h1>FuturoYO</h1>

        <p>Controla tus gastos y mejora tus hábitos financieros</p>

    </header>

    <main>

        <div class="registro">

            <h2>Iniciar Sesión</h2>

            <form id="formLogin">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingrese su correo"
                    required>

                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingrese su contraseña"
                    required>

                <button type="submit">

                    Iniciar Sesión

                </button>

            </form>

            <p id="mensaje"></p>

            <hr>

            <p>
                ¿No tienes una cuenta?
            </p>

            <a href="registro.html">

                Crear Cuenta

            </a>

            <br><br>

        </div>

    </main>

</body>

</html>
